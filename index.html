<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workflow Status Playground</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0e;
    --surface: #181818;
    --border: #2a2a2a;
    --border-light: #333;
    --text: #e8e8e8;
    --muted: #666;
    --todo: #4a9eff;
    --todo-dim: #1a3a5e;
    --progress: #f5a623;
    --progress-dim: #4a3010;
    --done: #4caf79;
    --done-dim: #1a3a2a;
    --error: #ff5555;
    --error-dim: #3a1a1a;
    --success: #4caf79;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  header h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text);
  }
  header span {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr 280px;
    height: calc(100vh - 57px);
  }

  .panel {
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .panel:last-child { border-right: none; }

  .panel-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* ── Items Panel ── */
  .item-list { padding: 8px; }

  .item-card {
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 14px 16px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }
  .item-card:hover { border-color: var(--border-light); background: #1c1c1c; }
  .item-card.selected {
    border-color: var(--text);
    background: var(--surface);
  }

  .item-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .item-id {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .status-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 2px;
  }
  .badge-todo { color: var(--todo); background: var(--todo-dim); }
  .badge-in_progress { color: var(--progress); background: var(--progress-dim); }
  .badge-done { color: var(--done); background: var(--done-dim); }

  .item-name {
    font-size: 13px;
    color: var(--text);
    font-family: var(--sans);
  }

  .add-btn {
    font-family: var(--mono);
    font-size: 11px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 2px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: color 0.15s, border-color 0.15s;
  }
  .add-btn:hover { color: var(--text); border-color: var(--border-light); }

  /* ── Transition Panel ── */
  .transition-area { padding: 20px; }

  .selected-item-info {
    margin-bottom: 20px;
  }
  .selected-item-info .label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .selected-item-info .name {
    font-size: 16px;
    font-family: var(--sans);
    font-weight: 600;
    color: var(--text);
  }
  .selected-item-info .current-status {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .selected-item-info .current-status strong {
    font-weight: 600;
  }

  .no-selection {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  .section-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* State machine diagram */
  .state-diagram {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 20px;
  }
  .transition-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
  }
  .arrow { color: var(--muted); }
  .t-from { color: var(--muted); }
  .t-to { color: var(--text); }

  /* Target selection */
  .target-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .target-btn {
    font-family: var(--mono);
    font-size: 11px;
    padding: 10px 8px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  .target-btn.active-todo { border-color: var(--todo); color: var(--todo); background: var(--todo-dim); }
  .target-btn.active-progress { border-color: var(--progress); color: var(--progress); background: var(--progress-dim); }
  .target-btn.active-done { border-color: var(--done); color: var(--done); background: var(--done-dim); }
  .target-btn:hover:not(:disabled) { border-color: var(--border-light); color: var(--text); }
  .target-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .execute-btn {
    width: 100%;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 12px;
    border-radius: 3px;
    border: 1px solid var(--border-light);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
  }
  .execute-btn:hover:not(:disabled) { background: #222; border-color: #444; }
  .execute-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Direct API input */
  .api-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .api-input {
    flex: 1;
    font-family: var(--mono);
    font-size: 11px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.15s;
  }
  .api-input:focus { border-color: var(--border-light); }
  .api-input::placeholder { color: var(--muted); }
  .api-submit {
    font-family: var(--mono);
    font-size: 11px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 12px;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .api-submit:hover { color: var(--text); border-color: var(--border-light); }

  /* ── Log Panel ── */
  .log-list { padding: 8px; }

  .log-entry {
    padding: 10px 12px;
    margin-bottom: 4px;
    border-radius: 2px;
    border-left: 2px solid transparent;
    font-size: 11px;
    line-height: 1.5;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(8px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .log-success {
    border-left-color: var(--success);
    background: #1a2420;
  }
  .log-error {
    border-left-color: var(--error);
    background: var(--error-dim);
  }
  .log-info {
    border-left-color: var(--border);
    background: var(--surface);
  }

  .log-timestamp {
    color: var(--muted);
    font-size: 10px;
    margin-bottom: 3px;
  }
  .log-msg { color: var(--text); }
  .log-detail {
    color: var(--muted);
    font-size: 10px;
    margin-top: 2px;
    font-style: italic;
  }
  .log-code {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-top: 3px;
  }
  .log-success .log-code { color: var(--done); }
  .log-error .log-code { color: var(--error); }

  .clear-btn {
    font-family: var(--mono);
    font-size: 10px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: color 0.15s;
  }
  .clear-btn:hover { color: var(--text); }

  /* Feedback flash */
  .feedback {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 3px;
    font-size: 12px;
    line-height: 1.5;
    display: none;
  }
  .feedback.show { display: block; animation: fadeIn 0.2s ease; }
  .feedback.ok { background: #1a2420; border: 1px solid var(--done); color: var(--done); }
  .feedback.err { background: var(--error-dim); border: 1px solid var(--error); color: var(--error); }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <h1>Workflow Status Playground</h1>
  <span>// state machine demo</span>
</header>

<div class="layout">
  <!-- Panel 1: Items -->
  <div class="panel">
    <div class="panel-header">
      <span>Items</span>
      <button class="add-btn" onclick="addItem()">+ add</button>
    </div>
    <div class="item-list" id="itemList"></div>
  </div>

  <!-- Panel 2: Transitions -->
  <div class="panel">
    <div class="panel-header">
      <span>Transition</span>
    </div>
    <div id="transitionArea">
      <div class="no-selection">
        ← select an item<br>to attempt a transition
      </div>
    </div>
  </div>

  <!-- Panel 3: Log -->
  <div class="panel">
    <div class="panel-header">
      <span>Event Log</span>
      <button class="clear-btn" onclick="clearLog()">clear</button>
    </div>
    <div class="log-list" id="logList"></div>
  </div>
</div>

<script>
// ============================================================
// CORE: Workflow State Machine
// ============================================================

const VALID_STATUSES = new Set(['todo', 'in_progress', 'done']);

const ALLOWED_TRANSITIONS = {
  todo: ['in_progress'],
  in_progress: ['todo', 'done'],
  done: [],
};

/**
 * Attempt a status transition.
 * Returns { ok: true, from, to } | { ok: false, error: string, code: string }
 */
function transition(currentStatus, targetStatus) {
  if (!VALID_STATUSES.has(targetStatus)) {
    return { ok: false, error: `"${targetStatus}" is not a valid status.`, code: 'INVALID_STATUS' };
  }
  if (currentStatus === targetStatus) {
    return { ok: false, error: `Self-transition not allowed (${currentStatus} → ${targetStatus}).`, code: 'SELF_TRANSITION' };
  }
  if (!ALLOWED_TRANSITIONS[currentStatus]?.includes(targetStatus)) {
    return { ok: false, error: `Transition ${currentStatus} → ${targetStatus} is not permitted.`, code: 'INVALID_TRANSITION' };
  }
  return { ok: true, from: currentStatus, to: targetStatus };
}

// ============================================================
// STATE: App data
// ============================================================

let items = [
  { id: 'item-001', name: 'Design database schema', status: 'todo' },
  { id: 'item-002', name: 'Implement auth flow', status: 'in_progress' },
  { id: 'item-003', name: 'Write API documentation', status: 'done' },
  { id: 'item-004', name: 'Add rate limiting', status: 'todo' },
  { id: 'item-005', name: 'Deploy to staging', status: 'in_progress' },
];

let selectedId = null;
let selectedTarget = null;
let itemCounter = 6;
let logEntries = [];

// ============================================================
// ACTIONS
// ============================================================

function selectItem(id) {
  selectedId = id;
  selectedTarget = null;
  render();
}

function selectTarget(status) {
  selectedTarget = status;
  render();
}

function executeTransition() {
  if (!selectedId || !selectedTarget) return;
  const item = items.find(i => i.id === selectedId);
  if (!item) return;

  const result = transition(item.status, selectedTarget);

  if (result.ok) {
    const prev = item.status;
    item.status = result.to;
    log({
      type: 'success',
      msg: `${item.name}`,
      detail: `${prev} → ${result.to}`,
      code: 'TRANSITION_OK',
    });
    selectedTarget = null;
    render();
    showFeedback(true, `Transitioned: ${prev} → ${result.to}`);
  } else {
    log({
      type: 'error',
      msg: result.error,
      code: result.code,
    });
    render();
    showFeedback(false, `[${result.code}] ${result.error}`);
  }
}

// Direct API-style input
function attemptRawTransition(targetRaw) {
  if (!selectedId) {
    log({ type: 'error', msg: 'No item selected.', code: 'NO_ITEM' });
    showFeedback(false, 'No item selected.');
    return;
  }
  const item = items.find(i => i.id === selectedId);
  if (!item) return;

  const result = transition(item.status, targetRaw.trim());

  if (result.ok) {
    const prev = item.status;
    item.status = result.to;
    log({ type: 'success', msg: `${item.name}`, detail: `${prev} → ${result.to}`, code: 'TRANSITION_OK' });
    selectedTarget = null;
    render();
    showFeedback(true, `Transitioned: ${prev} → ${result.to}`);
  } else {
    log({ type: 'error', msg: result.error, code: result.code });
    showFeedback(false, `[${result.code}] ${result.error}`);
  }
}

function addItem() {
  const id = `item-${String(itemCounter).padStart(3, '0')}`;
  itemCounter++;
  const names = ['Refactor tests', 'Update dependencies', 'Fix edge case', 'Review PR', 'Write specs'];
  const name = names[Math.floor(Math.random() * names.length)];
  items.push({ id, name, status: 'todo' });
  log({ type: 'info', msg: `Added item: ${name}`, code: 'ITEM_ADDED' });
  render();
}

function clearLog() {
  logEntries = [];
  renderLog();
}

// ============================================================
// LOGGING
// ============================================================

function log(entry) {
  logEntries.unshift({ ...entry, ts: new Date() });
  if (logEntries.length > 50) logEntries.pop();
  renderLog();
}

function fmt(date) {
  return date.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// ============================================================
// RENDER
// ============================================================

function badgeClass(status) {
  if (status === 'todo') return 'badge-todo';
  if (status === 'in_progress') return 'badge-in_progress';
  if (status === 'done') return 'badge-done';
  return '';
}

function renderItems() {
  const el = document.getElementById('itemList');
  el.innerHTML = items.map(item => `
    <div class="item-card ${selectedId === item.id ? 'selected' : ''}" onclick="selectItem('${item.id}')">
      <div class="item-card-top">
        <span class="item-id">${item.id}</span>
        <span class="status-badge ${badgeClass(item.status)}">${item.status}</span>
      </div>
      <div class="item-name">${item.name}</div>
    </div>
  `).join('');
}

function renderTransition() {
  const el = document.getElementById('transitionArea');

  if (!selectedId) {
    el.innerHTML = `<div class="no-selection">← select an item<br>to attempt a transition</div>`;
    return;
  }

  const item = items.find(i => i.id === selectedId);
  const allowed = ALLOWED_TRANSITIONS[item.status] || [];

  const targetBtnClass = (s) => {
    const base = 'target-btn';
    const isSelected = selectedTarget === s;
    if (!isSelected) return base;
    if (s === 'todo') return base + ' active-todo';
    if (s === 'in_progress') return base + ' active-progress';
    if (s === 'done') return base + ' active-done';
    return base;
  };

  el.innerHTML = `
    <div class="transition-area">
      <div class="selected-item-info">
        <div class="label">Selected</div>
        <div class="name">${item.name}</div>
        <div class="current-status">Current status: <strong>${item.status}</strong></div>
      </div>

      <hr class="divider">

      <div class="section-label">Allowed transitions from this state</div>
      <div class="state-diagram">
        ${ALLOWED_TRANSITIONS[item.status].length === 0
          ? `<div style="font-size:11px;color:var(--muted);">No transitions available (terminal state)</div>`
          : ALLOWED_TRANSITIONS[item.status].map(t =>
              `<div class="transition-row">
                <span class="t-from">${item.status}</span>
                <span class="arrow">→</span>
                <span class="t-to">${t}</span>
              </div>`
            ).join('')
        }
      </div>

      <hr class="divider">

      <div class="section-label">Quick select target</div>
      <div class="target-grid">
        ${['todo', 'in_progress', 'done'].map(s => `
          <button
            class="${targetBtnClass(s)}"
            onclick="selectTarget('${s}')"
            ${item.status === s ? 'title="Current status"' : ''}
          >${s}</button>
        `).join('')}
      </div>

      <button class="execute-btn" onclick="executeTransition()" ${!selectedTarget ? 'disabled' : ''}>
        → Execute Transition
      </button>

      <div class="feedback" id="feedback"></div>

      <hr class="divider">

      <div class="section-label">Raw input (test invalid values)</div>
      <div class="api-input-row">
        <input
          class="api-input"
          id="rawInput"
          placeholder="e.g. done, cancelled, DONE"
          onkeydown="if(event.key==='Enter') submitRaw()"
        >
        <button class="api-submit" onclick="submitRaw()">send →</button>
      </div>
    </div>
  `;
}

function submitRaw() {
  const val = document.getElementById('rawInput')?.value ?? '';
  attemptRawTransition(val);
  const inp = document.getElementById('rawInput');
  if (inp) inp.value = '';
}

function showFeedback(ok, msg) {
  const el = document.getElementById('feedback');
  if (!el) return;
  el.className = `feedback show ${ok ? 'ok' : 'err'}`;
  el.textContent = msg;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.className = 'feedback'; }, 4000);
}

function renderLog() {
  const el = document.getElementById('logList');
  if (logEntries.length === 0) {
    el.innerHTML = `<div style="padding:20px;font-size:11px;color:var(--muted);text-align:center;">No events yet</div>`;
    return;
  }
  el.innerHTML = logEntries.map(e => `
    <div class="log-entry log-${e.type}">
      <div class="log-timestamp">${fmt(e.ts)}</div>
      <div class="log-msg">${e.msg}</div>
      ${e.detail ? `<div class="log-detail">${e.detail}</div>` : ''}
      <div class="log-code">${e.code}</div>
    </div>
  `).join('');
}

function render() {
  renderItems();
  renderTransition();
  renderLog();
}

// ============================================================
// INIT
// ============================================================

log({ type: 'info', msg: 'Workflow playground initialized.', code: 'INIT' });
render();
</script>
</body>
</html>
